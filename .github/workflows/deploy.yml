# Publica el planificador en GitHub Pages con cada push a master.
#
# Antes, Pages servía la raíz del repositorio tal cual. Eso funcionaba mientras
# la aplicación no necesitaba compilarse; con Vite, la raíz contiene el código
# fuente y el navegador recibía una página en blanco. Compilar aquí hace que lo
# publicado no pueda separarse de lo que está en master.
name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue a la vez, sin cancelar el que ya esté en curso
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Comprobar antes de publicar
        run: npm test

      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
